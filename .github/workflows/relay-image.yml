name: Relay image

# Builds the relay's Docker image on every pull request and on main, then runs it the way the
# self-hosting guide does (relay/deploy/compose.yaml, behind Caddy), with localhost as the domain so
# that Caddy serves HTTPS from its own local certificate authority. The deployed-relay tests then
# pair and sync through it, and the job checks that the relay runs unprivileged, read-only, and
# keeps its data across a restart.
#
# Only Docker, Compose and the runner's own Node are used, so no third-party action runs here.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Relay image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELAY_IMAGE: cometotp-relay:ci
      RELAY_DOMAIN: localhost
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # The check comes from the default branch, so the commit being checked cannot change it.
      - name: Fetch the security check from the default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .security-check
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Reject incident indicators before running repository code
        run: |
          mv .security-check/.github/scripts/check_repository_security.py "$RUNNER_TEMP/"
          rm -rf .security-check
          python3 -I "$RUNNER_TEMP/check_repository_security.py"

      - name: Build the image
        run: |
          docker build --file relay/Dockerfile --tag "$RELAY_IMAGE" .
          docker image ls "$RELAY_IMAGE"

      - name: Start it as the self-hosting guide does
        working-directory: relay/deploy
        run: docker compose up --detach --wait --wait-timeout 120

      - name: Wait for HTTPS and trust Caddy's local certificate authority
        working-directory: relay/deploy
        run: |
          for i in $(seq 1 30); do
            curl --silent --insecure --fail https://localhost/v1/ && break
            sleep 2
          done
          docker compose cp caddy:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/caddy-root.crt"
          curl --silent --show-error --fail --cacert "$RUNNER_TEMP/caddy-root.crt" https://localhost/v1/
          echo
          # Plain HTTP is only a redirect to HTTPS.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost/v1/)" = 308

      - name: Install the locked dependencies without install scripts
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Pair and sync through it
        env:
          RELAY_URL: https://localhost
        run: |
          # The image says its version, from relay/package.json, as a deployment checks it.
          export RELAY_VERSION="$(node -p 'require("./relay/package.json").version')"
          NODE_EXTRA_CA_CERTS="$RUNNER_TEMP/caddy-root.crt" node --test relay/dist/test/deployed.test.js

      - name: Check it runs unprivileged and read-only, and keeps its data across a restart
        working-directory: relay/deploy
        run: |
          test "$(docker compose exec -T relay id -u)" != 0
          if docker compose exec -T relay touch /app/written 2>/dev/null; then
            echo "The relay could write to its own code"
            exit 1
          fi
          test "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps --quiet relay)")" = healthy

          id=$(python3 -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(16)).decode().rstrip("="))')
          hash=$(python3 -c 'import base64, hashlib, os; print(base64.urlsafe_b64encode(hashlib.sha256(os.urandom(32)).digest()).decode().rstrip("="))')
          vault() {
            curl --silent --output /dev/null --write-out '%{http_code}' --cacert "$RUNNER_TEMP/caddy-root.crt" \
              --header 'Content-Type: application/json' \
              --data "{\"id\":\"$id\",\"write\":\"$hash\",\"read\":\"$hash\"}" https://localhost/v1/vaults
          }
          test "$(vault)" = 201
          docker compose restart relay
          docker compose up --detach --wait --wait-timeout 120
          # The id is still taken: the vault outlived the restart.
          test "$(vault)" = 409

      - name: Show the logs
        if: always()
        working-directory: relay/deploy
        run: docker compose logs --no-color

      - name: Stop it
        if: always()
        working-directory: relay/deploy
        run: docker compose down --volumes
