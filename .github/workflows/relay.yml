name: Relay

# Builds the relay and runs its API tests on every pull request and on main. Dependencies install
# from the lockfile with install scripts switched off, and the runner's own Node (22.13 or later,
# for node:sqlite) is used, so no third-party action runs here.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay:
    name: Relay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # The check comes from the default branch, so the commit being checked cannot change it.
      - name: Fetch the security check from the default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .security-check
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Reject incident indicators before running repository code
        run: |
          mv .security-check/.github/scripts/check_repository_security.py "$RUNNER_TEMP/"
          rm -rf .security-check
          python3 -I "$RUNNER_TEMP/check_repository_security.py"

      - name: Show the tool versions
        run: |
          node --version
          npm --version

      - name: Install the locked dependencies without install scripts
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Test the relay
        run: npm test --workspace @cometotp/relay
