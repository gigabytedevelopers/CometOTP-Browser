name: Repository security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Repository security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the proposed tree without saved credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # The check that decides comes from the default branch, so the commit being checked cannot
      # change it. The commit's own copy runs after it, so a change to the check is tried too.
      - name: Fetch the security check from the default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .security-check
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Reject editor autorun, disguised payloads, and committed credentials
        run: |
          mv .security-check/.github/scripts/check_repository_security.py "$RUNNER_TEMP/"
          rm -rf .security-check
          python3 -I "$RUNNER_TEMP/check_repository_security.py"

      - name: Run this commit's own copy of the check
        run: python3 -I .github/scripts/check_repository_security.py
